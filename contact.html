<!DOCTYPE html>
<html>
<head>
    <title>Contact - Xander's Midterm Portfolio</title>
    <style>
        header, footer {
            background-color: #22252A;
            color: #FFFFFF;
            text-align: center; 
            padding: 15px 0;
        }

        header a {
            color: #FFFFFF;
            margin: 0 10px;
            text-decoration: none;
        }

        .header-divider, .footer-divider {
            border: 0;
            height: 3px;
            background: linear-gradient(to right, #ffffff, #22252A, #ffffff);
        }

        .card-container {
            text-align: center; 
            margin: 0 auto; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Xander's Midterm Portfolio</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="media.html">Media</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    
    <hr class="header-divider">

    <div class="card-container">
        <img src="Triatots4.png" alt="Contact Xander" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover;">
        
        <h1>Contact Details</h1>
        
        <form action="/submit-contact-form" method="POST">
            <fieldset>
                <legend>Contact Form</legend>
                
                <label for="fullName">Full Name *</label><br>
                <input type="text" id="fullName" name="fullName" required minlength="3"><br><br>

                <label for="emailAddress">Email Address *</label><br>
                <input type="email" id="emailAddress" name="emailAddress" required><br><br>

                <label for="inquiryType">Select Inquiry Type</label><br>
                <select id="inquiryType" name="inquiryType">
                    <option value="general">General Inquiry</option>
                    <option value="project">Project Proposal</option>
                    <option value="feedback">Feedback</option>
                </select><br><br>

                <label for="message">Message *</label><br>
                <textarea id="message" name="message" required minlength="3"></textarea><br><br>

                <button type="submit">Send Message</button>
            </fieldset>
        </form>
    </div>

    <hr class="footer-divider">
    
    <footer>
        <p>&copy; Developed by Xander | HUMAN-COMPUTER INTERACTION</p>
    </footer>
</body>
</html>
